<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MDL Core</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fbfaf8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ===== MAIN APP ===== -->
    <div id="app">
        <header id="main-header">
            <img src="logo.png" alt="Mandala Ensambles" id="main-logo">
        </header>

        <main id="main-content" class="sections-container">
            <!-- GRUPO 1: APLICACIONES (AZUL SUAVE) -->
            <section class="modules-group-section">
                <div id="grid-apps" class="modules-grid"></div>
            </section>

            <!-- LÍNEA SEPARADORA GRIS CLARO -->
            <div id="main-divider-wrap" class="section-divider-wrap">
                <div class="section-divider-line"></div>
                <div class="section-divider-pill">ENLACES EXTERNOS</div>
                <div class="section-divider-line"></div>
            </div>

            <!-- GRUPO 2: ENLACES EXTERNOS (ANARANJADO CLARO) -->
            <section class="modules-group-section">
                <div id="grid-webs" class="modules-grid"></div>
            </section>
        </main>
    </div>

    <!-- ===== TOAST ===== -->
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <!-- ===== VERSIÓN (PEQUEÑO Y EN GRIS ABAJO A LA IZQUIERDA) ===== -->
    <div class="app-version-text" aria-label="Versión del sistema">v1.0</div>

    <!-- ===== BOTÓN CONFIGURAR ===== -->
    <button id="btn-config" class="btn-config" aria-label="Configurar módulos">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        Configurar
    </button>

    <!-- ===== MODAL DE CONFIGURACIÓN MASTER-DETAIL (2 COLUMNAS) ===== -->
    <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div id="config-modal" class="config-modal-split" style="position:relative;">

            <!-- HEADER DEL MODAL -->
            <div class="modal-header">
                <div>
                    <h2 id="modal-title">Configuración de Módulos</h2>
                    <p style="font-size:12px; color:var(--text-muted); margin-top:2px;">Reordena con las flechas dentro de cada categoría o gestiona su visibilidad</p>
                </div>
                <button id="btn-close-modal" class="btn-icon" aria-label="Cerrar configuración">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <!-- CUERPO MASTER-DETAIL -->
            <div class="modal-split-body">
                <!-- LATERAL IZQUIERDO -->
                <aside class="modal-sidebar">
                    <div class="sidebar-top-actions">
                        <button type="button" id="btn-sidebar-add" class="btn-sidebar-add">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            Agregar nuevo módulo
                        </button>
                    </div>
                    <div id="sidebar-list" class="sidebar-modules-list"></div>
                </aside>

                <!-- PANEL DERECHO DE DETALLE -->
                <section id="detail-panel" class="modal-detail-panel"></section>
            </div>

            <!-- FOOTER DEL MODAL -->
            <div class="modal-footer" style="padding:14px 26px; background:#faf8f5;">
                <button id="btn-cancel-modal" class="btn-secondary">Cancelar</button>
                <button id="btn-save-modal" class="btn-primary">Guardar cambios</button>
            </div>

            <!-- DIÁLOGO: AGREGAR NUEVO MÓDULO -->
            <div id="new-module-dialog" class="mini-dialog-overlay" style="display:none;">
                <div class="mini-dialog-card">
                    <div>
                        <h4 style="font-size:16px; font-weight:800; color:#1f5491; margin-bottom:4px;">Nuevo Módulo</h4>
                        <p style="font-size:12.5px; color:var(--text-muted);">Indica el título y selecciona la categoría</p>
                    </div>

                    <div class="field-group">
                        <label for="new-mod-title">Título del módulo</label>
                        <input type="text" id="new-mod-title" class="input-text" placeholder="Ej: Grabación en Estudio" autocomplete="off">
                    </div>

                    <div class="field-group">
                        <label>Categoría</label>
                        <div class="type-selector-box">
                            <button type="button" id="btn-type-app" class="type-option-btn selected type-app-btn">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>
                                Aplicación
                            </button>
                            <button type="button" id="btn-type-web" class="type-option-btn type-web-btn">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="2" x2="22" y1="12" y2="12"/></svg>
                                Enlace Externo
                            </button>
                        </div>
                    </div>

                    <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">
                        <button type="button" id="btn-cancel-new-mod" class="btn-secondary" style="padding:8px 14px; font-size:13px;">Cancelar</button>
                        <button type="button" id="btn-confirm-new-mod" class="btn-primary" style="padding:8px 18px; font-size:13px;">Crear y Configurar</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script type="module" src="app.js?v=2.0"></script>
</body>
</html>
